version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Vitest si aggiorna solo quando il pool Workers di @cloudflare/vitest-plugin lo supporta: la
    # 5.0.4 rompeva la cache dei moduli, la 5.1.0 chiama `AsyncLocalStorage.disable()`, assente in
    # workerd (21 suite falliscono all'import). I pacchetti @vitest/* dichiarano come peer la
    # versione esatta di vitest e si aggiornano insieme, a mano.
    ignore:
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
      # @react-router/dev 8.5.1 non scrive il manifest client dove lo legge il build del Worker
      # con @cloudflare/vite-plugin: `react-router build` fallisce. Si resta sulla 8.5.0.
      - dependency-name: "react-router"
        versions: ["8.5.1"]
      - dependency-name: "@react-router/dev"
        versions: ["8.5.1"]
    groups:
      # Le tre librerie app Shopify dichiarano peer reciproci: una major da sola non installa.
      shopify-app-major:
        applies-to: version-updates
        patterns:
          - "@shopify/shopify-api"
          - "@shopify/shopify-app-*"
        update-types:
          - major
      # La packageExtension del peer react-router nomina la versione esatta e npm 12 non la
      # riapplica a un lockfile esistente: ogni patch di questo pacchetto si aggiorna a mano.
      # Fuori dal gruppo, la sua PR separata non blocca gli altri aggiornamenti.
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@shopify/shopify-app-react-router"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
