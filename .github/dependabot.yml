version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Le major di Vitest arrivano solo quando @cloudflare/vitest-plugin le supporta. La 5.0.4 rompe
    # la cache dei moduli nel pool Workers (tutte le suite falliscono su `.vitest-cache`): si salta.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        versions: ["5.0.4"]
      - dependency-name: "@vitest/*"
        versions: ["5.0.4"]
    groups:
      # Le tre librerie app Shopify dichiarano peer reciproci: una major da sola non installa.
      shopify-app-major:
        applies-to: version-updates
        patterns:
          - "@shopify/shopify-api"
          - "@shopify/shopify-app-*"
        update-types:
          - major
      # La packageExtension del peer react-router nomina la versione esatta e npm 12 non la
      # riapplica a un lockfile esistente: ogni patch di questo pacchetto si aggiorna a mano.
      # Fuori dal gruppo, la sua PR separata non blocca gli altri aggiornamenti.
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@shopify/shopify-app-react-router"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
