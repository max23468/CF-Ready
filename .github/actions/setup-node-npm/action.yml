name: Setup Node e npm
description: Configura le versioni Node e npm canoniche con la cache npm

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 26.10.0
        cache: npm
    - shell: bash
      run: npm install --global npm@12.1.0
