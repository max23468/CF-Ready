name: Setup Node e npm
description: Configura le versioni Node e npm canoniche con la cache npm

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.0
        cache: npm
    - shell: bash
      run: npm install --global npm@12.2.1
