name: Prepare installation diagnostics

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'max23468/CF-Ready' && github.event.pull_request.number == 512 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/owner-installation-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
      - run: npm ci
      - name: Prepara test, formattazione e versione senza aggiornare branch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const replace = (path, before, after) => {
            const source = fs.readFileSync(path, 'utf8');
            assert.equal(source.split(before).length, 2, `Sostituzione non univoca: ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          };
          replace('tests/app-nav.test.ts', 'const mocks = vi.hoisted(() => ({ authenticateAdmin: vi.fn() }));', 'const mocks = vi.hoisted(() => ({\n  authenticateAdmin: vi.fn(),\n  readInstallationStartedAt: vi.fn(),\n}));');
          replace('tests/app-nav.test.ts', 'import { loader, NAV } from "../app/routes/app";', 'vi.mock("../app/installation-diagnostics.server", () => ({\n  readInstallationStartedAt: mocks.readInstallationStartedAt,\n}));\n\nimport { loader, NAV } from "../app/routes/app";');
          replace('tests/app-nav.test.ts', '  await expect(loader({ request, context: {} } as never)).resolves.toMatchObject({', '  const db = {};\n  const context = { get: vi.fn(() => db) };\n  mocks.readInstallationStartedAt.mockResolvedValueOnce("2026-09-14T12:00:00.000Z");\n\n  await expect(loader({ request, context } as never)).resolves.toMatchObject({\n    installedAt: "2026-09-14T12:00:00.000Z",');
          replace('tests/app-nav.test.ts', '  expect(mocks.authenticateAdmin).toHaveBeenCalledWith(request, {});', '  expect(mocks.authenticateAdmin).toHaveBeenCalledWith(request, context);\n  expect(mocks.readInstallationStartedAt).toHaveBeenCalledWith(db, "negozio.myshopify.com");');
          fs.appendFileSync('tests/app-nav.test.ts', '\ntest("la diagnostica non impedisce il caricamento se la lettura D1 fallisce", async () => {\n  mocks.authenticateAdmin.mockResolvedValueOnce({ session: { shop: "negozio.myshopify.com" } });\n  mocks.readInstallationStartedAt.mockRejectedValueOnce(new Error("synthetic storage failure"));\n  const request = new Request("https://cf-ready.test/app");\n  const context = { get: () => ({}) };\n  await expect(loader({ request, context } as never)).resolves.toMatchObject({ installedAt: null });\n});\n');
          replace('tests/migrations.test.ts', '    "0023_owner_operational_incidents.sql",\n  ]);', '    "0023_owner_operational_incidents.sql",\n    "0024_installation_diagnostics.sql",\n  ]);');
          replace('tests/migrations.test.ts', '  await applyD1Migrations(db, [migrationAfter(migrations, "0022_configuration_history.sql")]);', '  await applyD1Migrations(db, [migrationAfter(migrations, "0022_configuration_history.sql")]);\n  await applyD1Migrations(db, [migrationAfter(migrations, "0023_owner_operational_incidents.sql")]);');
          replace('tests/migrations.test.ts', '    "configuration_history",\n    "owner_control_state",', '    "configuration_history",\n    "installation_engagement",\n    "owner_control_state",');
          replace('tests/migrations.test.ts', '    "trial_ledger",\n    "trials",\n    "validation_operation_locks",', '    "trial_ledger",\n    "trials",\n    "uninstall_feedback",\n    "validation_operation_locks",');
          assert.equal(JSON.parse(fs.readFileSync('package.json', 'utf8')).version, '1.11.2');
          execFileSync('npm', ['version', '1.12.0', '--no-git-tag-version', '--ignore-scripts'], { stdio: 'inherit' });
          const changelog = 'CHANGELOG.md';
          const source = fs.readFileSync(changelog, 'utf8');
          assert.match(source, /^## 1\.11\.2/m);
          fs.writeFileSync(changelog, source.replace(/^## 1\.11\.2/m, '## 1.12.0 — 14 settembre 2026\n\n- il Control Center distingue la prima apertura dell’app e il primo ingresso\n  nell’onboarding, anche senza superare il passo 1;\n- la diagnostica conserva soltanto le prime rilevazioni dell’installazione\n  corrente, distinguendo i dati storici mancanti dai segnali non rilevati;\n- il dettaglio dello store recupera motivo e commento di disinstallazione\n  da Shopify Partner, senza reinviare notifiche già consegnate.\n\n## 1.11.2'));
          const planPath = 'docs/plans/2026-07-28-CF-Ready-Master-Plan.md';
          const plan = fs.readFileSync(planPath, 'utf8');
          assert(!plan.includes('| D-159 |'));
          const decision = '| D-159 | Distinguere la prima apertura visibile dell’app, il primo ingresso nell’onboarding anche senza avanzare dal passo 1 e l’avanzamento già registrato; mostrare nel Control Center il motivo e il commento nativi della disinstallazione Shopify. | Deciso dall’owner il 14 settembre 2026 per la `1.12.0`. La raccolta è autenticata, minimizzata e deduplicata per installazione; non modifica wizard, Validation o billing e non invia notifiche per ogni visita. I segnali assenti non provano una mancata apertura e non sono ricostruiti retroattivamente. Il feedback è conservato prima della deduplicazione delle notifiche e può essere riletto da `/shop`; null, risposta mancante e API fallita restano distinti. Il commento libero è un’eccezione esplicita e riservata ai contenuti della chat Telegram privata dell’owner: non viene copiato in log, analytics o repository e non è presentato come anonimizzato. Reinstallazione e cancellazione dello store eliminano i riepiloghi. Dettagli nel runbook `docs/runbooks/installation-diagnostics.md`. |';
          assert.equal((plan.match(/^\| D-158 \|.*$/gm) || []).length, 1);
          fs.writeFileSync(planPath, plan.replace(/^(\| D-158 \|.*)$/m, `$1\n${decision}`));
          const indexPath = 'docs/INDEX.md';
          const index = fs.readFileSync(indexPath, 'utf8');
          assert(!index.includes('runbooks/installation-diagnostics.md'));
          fs.writeFileSync(indexPath, index.trimEnd() + '\n- [Diagnosi installazioni](runbooks/installation-diagnostics.md) — aperture app, primo ingresso onboarding e feedback di disinstallazione Shopify.\n');
          replace('README.md', '## Documentazione e contributi', 'Il dettaglio `/shop` distingue inoltre la prima apertura dell’app e il primo\ningresso nell’onboarding dai progressi successivi. Per gli store disinstallati\nmostra il motivo e il commento forniti a Shopify e consente una rilettura\nesplicita; i dati storici mancanti non vengono interpretati come mancate visite.\nContratto e limiti sono in `docs/runbooks/installation-diagnostics.md`.\n\n## Documentazione e contributi');
          replace('AGENTS.md', '  senza dati personali di owner o clienti né identificatori Shopify.', '  senza dati personali di owner o clienti né identificatori Shopify. D-159\n  aggiunge il solo feedback libero di disinstallazione fornito a Shopify,\n  riservato al dettaglio e alle notifiche private dell’owner: non va copiato\n  in log, analytics, fixture o repository e non è un dato anonimizzato.');
          fs.unlinkSync('.github/workflows/prepare-installation-diagnostics.yml');
          execFileSync('node_modules/.bin/oxfmt', ['--write', 'app/owner-control/commands.server.ts', 'tests/installation-diagnostics.test.ts', 'tests/app-nav.test.ts', 'tests/migrations.test.ts'], { stdio: 'inherit' });
          execFileSync('git', ['diff', '--check'], { stdio: 'inherit' });
          NODE
      - run: npm run docs:check && npm run format:check && npm run typecheck
      - name: Crea un commit candidato senza push, merge o deploy
        env:
          GH_TOKEN: ${{ github.token }}
          PREP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const head = process.env.PREP_HEAD_SHA;
          assert.match(head, /^[0-9a-f]{40}$/);
          const repo = 'max23468/CF-Ready';
          const branch = 'feat/owner-installation-diagnostics';
          const allowed = new Set(['.github/workflows/prepare-installation-diagnostics.yml', 'AGENTS.md', 'README.md', 'CHANGELOG.md', 'package.json', 'package-lock.json', 'docs/INDEX.md', 'docs/plans/2026-07-28-CF-Ready-Master-Plan.md', 'app/owner-control/commands.server.ts', 'tests/installation-diagnostics.test.ts', 'tests/app-nav.test.ts', 'tests/migrations.test.ts']);
          const call = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method: body ? 'POST' : 'GET',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            assert(response.ok, `GitHub ${path}: HTTP ${response.status}`);
            return response.json();
          };
          const current = await call(`git/ref/heads/${branch}`);
          assert.equal(current.object.sha, head, 'Il branch è avanzato; candidato non creato');
          const base = await call(`git/commits/${head}`);
          const paths = execFileSync('git', ['diff', '--name-only', '-z', head], { encoding: 'utf8' }).split('\0').filter(Boolean);
          assert(paths.length > 0);
          for (const path of paths) assert(allowed.has(path), `File inatteso: ${path}`);
          const tree = await call('git/trees', {
            base_tree: base.tree.sha,
            tree: paths.map(path => fs.existsSync(path)
              ? { path, mode: '100644', type: 'blob', content: fs.readFileSync(path, 'utf8') }
              : { path, mode: '100644', type: 'blob', sha: null }),
          });
          const commit = await call('git/commits', {
            message: 'fix: allinea test e prepara la versione 1.12.0 della diagnostica owner',
            tree: tree.sha,
            parents: [head],
          });
          console.log(`PREPARED_COMMIT=${commit.sha}`);
          console.log(`PREPARED_TREE=${tree.sha}`);
          console.log('Nessun branch aggiornato; il candidato deve superare i gate CI ordinari prima del merge.');
          NODE
