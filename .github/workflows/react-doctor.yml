name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: >-
          node scripts/ci-lane.mjs
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --base-ref "$BASE_REF"
          --head-ref "$HEAD_REF"
      - id: doctor
        if: steps.lane.outputs.react_doctor == 'true'
        uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2.2.9
        with:
          version: latest
          scope: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}
          blocking: warning
          comment: "false"
          review-comments: "true"
          commit-status: "false"
      - if: steps.lane.outputs.react_doctor != 'true'
        run: echo "React Doctor non applicabile alla corsia ${{ steps.lane.outputs.lane }}."
