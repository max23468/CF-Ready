name: Prepare release 1.12.0 temporary

on:
  push:
    branches:
      - feat/trial-continuity-home-onboarding

permissions:
  contents: write

concurrency:
  group: prepare-release-1-12-0-temp
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/trial-continuity-home-onboarding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/trial-continuity-home-onboarding
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-npm
      - name: Aggiorna manifest e lockfile
        run: npm version 1.12.0 --no-git-tag-version
      - name: Aggiorna changelog
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "CHANGELOG.md";
          let content = readFileSync(path, "utf8");
          const heading = "## 1.12.0 — 14 settembre 2026";
          if (!content.includes(heading)) {
            const marker = "## 1.11.2 — 13 settembre 2026";
            if (!content.includes(marker)) throw new Error(`Marker changelog non trovato: ${marker}`);
            const section = `${heading}\n\n- Home e completamento onboarding spiegano quando termina la prova e permettono di scegliere facoltativamente un piano senza perdere i giorni gratuiti rimanenti;\n- dopo l’approvazione di un abbonamento durante la prova, Home mostra la continuità del servizio e la data prevista del primo addebito senza riproporre l’invito a scegliere un piano.\n\n`;
            content = content.replace(marker, section + marker);
            writeFileSync(path, content);
          }
          NODE
      - name: Rimuovi workflow temporaneo e crea commit
        shell: bash
        run: |
          rm .github/workflows/prepare-release-1-12-0-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md .github/workflows/prepare-release-1-12-0-temp.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "Nessuna modifica da registrare."; exit 0; }
          git commit -m "chore: prepara CF Ready 1.12.0"
          git push origin HEAD:feat/trial-continuity-home-onboarding
