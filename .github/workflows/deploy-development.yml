name: Deploy Development

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Development
    outputs:
      rollback_commit: ${{ steps.rollback_snapshot.outputs.commit }}
      shopify_rollback_version_tag: ${{ steps.rollback_snapshot.outputs.shopify_version_tag }}
      worker_rollback_version_id: ${{ steps.rollback_snapshot.outputs.worker_version_id }}

    steps:
      - name: Verifica branch
        run: test "$GITHUB_REF" = "refs/heads/develop"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verifica URL Development persistenti
        run: |
          grep -Fxq 'application_url = "https://cf-ready-dev.tmsf.workers.dev"' shopify.app.dev.toml
          grep -Fxq 'redirect_urls = [ "https://cf-ready-dev.tmsf.workers.dev/auth/callback" ]' shopify.app.dev.toml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.5.1
          cache: npm

      - run: npm install --global npm@12.0.2
      - run: npm install --global @shopify/cli@4.6.0
      - run: npm ci
      - run: npm run check

      - name: Verifica credenziali provider
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$SHOPIFY_APP_AUTOMATION_TOKEN"

      - name: Preflight Development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_PROJECT_FILE: config/shopify-project.dev.json
        run: npm run preflight:dev

      # Lo snapshot prende la versione esatta del manifest: un nome già rilasciato fa
      # fallire il deploy, ed è il segnale che manca il bump SemVer della release.
      - name: Prepara versione
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "DEPLOY_VERSION=$version" >> "$GITHUB_ENV"
          {
            echo "## Ricevuta deploy Development"
            echo "- Ambiente: Development"
            echo "- Configurazione: \`wrangler.json\`, \`shopify.app.dev.toml\`"
            echo "- Versione repository/Shopify: \`$version\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOY_READBACK_ONLY" = "true" ]; then
            echo "- Retry dello snapshot già coordinato: eseguito solo readback" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Registra rollback Worker Development
        id: rollback_snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          npm exec -- wrangler deployments status --json > "$RUNNER_TEMP/worker-rollback.json"
          shopify app versions list --config dev --no-color --json > "$RUNNER_TEMP/shopify-rollback.json"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { verifyCoordinatedRollback } from "./scripts/preflight-dev.mjs";
            const deployment = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const versions = JSON.parse(readFileSync(process.argv[2], "utf8"));
            const rollback = verifyCoordinatedRollback(deployment, versions);
            appendFileSync(process.env.GITHUB_OUTPUT,
              `worker_version_id=${rollback.workerVersionId}\n` +
              `shopify_version_tag=${rollback.shopifyVersionTag}\n` +
              `commit=${rollback.commit}\n`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `- Rollback coordinato: Worker deployment \`${rollback.deploymentId}\`, ` +
              `versione \`${rollback.workerVersionId}\`; Shopify \`${rollback.shopifyVersionTag}\` ` +
              `(\`${rollback.shopifyVersionId}\`); commit \`${rollback.commit}\`\n`);
            console.log(`Rollback coordinato verificato: ${rollback.commit}`);
          ' "$RUNNER_TEMP/worker-rollback.json" "$RUNNER_TEMP/shopify-rollback.json"

      - name: Applica migrazioni D1 Development
        if: env.DEPLOY_READBACK_ONLY != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler d1 migrations apply DB --remote

      - name: Readback migrazioni D1 Development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm exec -- wrangler d1 migrations list DB --remote | tee "$RUNNER_TEMP/d1-migrations.txt"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { verifyNoPendingMigrations } from "./scripts/preflight-dev.mjs";
            verifyNoPendingMigrations(readFileSync(process.argv[1], "utf8"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "- D1 Development: nessuna migrazione pendente dopo il readback remoto\n");
          ' "$RUNNER_TEMP/d1-migrations.txt"

      - name: Deploy Worker Development
        id: worker_deploy
        if: env.DEPLOY_READBACK_ONLY != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler deploy --message "Development ${GITHUB_SHA}"

      - name: Readback Worker Development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm exec -- wrangler deployments status --json > "$RUNNER_TEMP/worker-deployment.json"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const deployment = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!deployment.id ||
                deployment.annotations?.["workers/message"] !== `Development ${process.env.GITHUB_SHA}` ||
                deployment.versions?.length !== 1 || deployment.versions[0].percentage !== 100) {
              throw new Error("Readback Worker Development non riuscito.");
            }
            const versionId = deployment.versions[0].version_id;
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `- Worker pubblicato: deployment \`${deployment.id}\`, versione \`${versionId}\`\n`);
            console.log(`Worker verificato: ${deployment.id} (${versionId})`);
          ' "$RUNNER_TEMP/worker-deployment.json"

      - name: Smoke Worker Development
        run: |
          curl --fail --silent --show-error --max-time 15 --output /dev/null \
            https://cf-ready-dev.tmsf.workers.dev
          echo "- Smoke: Worker Development raggiungibile" >> "$GITHUB_STEP_SUMMARY"

      - name: Verifica capacità Worker Development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run capacity:dev

      - name: Deploy Shopify Development
        if: env.DEPLOY_READBACK_ONLY != 'true'
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: >-
          shopify app deploy
          --config dev
          --allow-updates
          --version "$DEPLOY_VERSION"
          --message "Development ${GITHUB_SHA}"
          --source-control-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          --no-color

      - name: Readback versione attiva
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          shopify app versions list --config dev --no-color --json > "$RUNNER_TEMP/shopify-versions.json"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const versions = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const active = versions.find(({ status }) => status === "active");
            if (active?.versionTag !== process.env.DEPLOY_VERSION ||
                active.message !== `Development ${process.env.GITHUB_SHA}`) {
              throw new Error("Readback Shopify Development non riuscito.");
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `- Shopify attivo: versione \`${active.versionTag}\` (\`${active.versionId}\`), ` +
              `commit \`${process.env.GITHUB_SHA}\`\n`);
            console.log(`Versione attiva verificata: ${active.versionTag} (${active.versionId})`);
          ' "$RUNNER_TEMP/shopify-versions.json"

  rollback:
    name: Ripristina Development se il deploy non termina
    needs: deploy
    if: ${{ always() && needs.deploy.result != 'success' && needs.deploy.outputs.rollback_commit != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.5.1
          cache: npm

      - run: npm install --global npm@12.0.2
      - run: npm install --global @shopify/cli@4.6.0
      - run: npm ci

      - name: Ripristina snapshot Development coordinato
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          ROLLBACK_COMMIT: ${{ needs.deploy.outputs.rollback_commit }}
          SHOPIFY_ROLLBACK_VERSION_TAG: ${{ needs.deploy.outputs.shopify_rollback_version_tag }}
          WORKER_ROLLBACK_VERSION_ID: ${{ needs.deploy.outputs.worker_rollback_version_id }}
        run: |
          rollback_failed=0
          shopify_restored=0
          worker_restored=0

          if shopify app versions list --config dev --no-color --json > "$RUNNER_TEMP/shopify-before-rollback.json"; then
            active_tag="$(node -e 'const v=require(process.argv[1]); process.stdout.write(v.find(x=>x.status==="active")?.versionTag??"")' "$RUNNER_TEMP/shopify-before-rollback.json")"
            if [ "$active_tag" = "$SHOPIFY_ROLLBACK_VERSION_TAG" ]; then
              shopify_restored=1
            elif shopify app release --config dev --version "$SHOPIFY_ROLLBACK_VERSION_TAG" --allow-updates --no-color; then
              if shopify app versions list --config dev --no-color --json > "$RUNNER_TEMP/shopify-after-release.json"; then
                active_tag="$(node -e 'const v=require(process.argv[1]); process.stdout.write(v.find(x=>x.status==="active")?.versionTag??"")' "$RUNNER_TEMP/shopify-after-release.json")"
                [ "$active_tag" = "$SHOPIFY_ROLLBACK_VERSION_TAG" ] && shopify_restored=1
              fi
            fi
          fi

          if [ "$shopify_restored" -ne 1 ]; then
            echo "::error::Impossibile ripristinare la versione Shopify Development precedente."
            rollback_failed=1
          fi

          if npm exec -- wrangler deployments status --json > "$RUNNER_TEMP/worker-before-rollback.json"; then
            active_worker_version="$(node -e 'const d=require(process.argv[1]); process.stdout.write(d.versions?.[0]?.version_id??"")' "$RUNNER_TEMP/worker-before-rollback.json")"
            if [ "$active_worker_version" = "$WORKER_ROLLBACK_VERSION_ID" ]; then
              worker_restored=1
            elif [ "$shopify_restored" -eq 1 ] && npm exec -- wrangler rollback "$WORKER_ROLLBACK_VERSION_ID" --message "Rollback Development ${ROLLBACK_COMMIT}" --yes; then
              worker_restored=1
            fi
          fi
          if [ "$worker_restored" -ne 1 ]; then
            echo "::error::Impossibile ripristinare la versione Worker Development precedente."
            rollback_failed=1
          fi

          if [ "$rollback_failed" -eq 0 ]; then
            npm exec -- wrangler deployments status --json > "$RUNNER_TEMP/worker-after-rollback.json" || rollback_failed=1
            shopify app versions list --config dev --no-color --json > "$RUNNER_TEMP/shopify-after-rollback.json" || rollback_failed=1
          fi
          if [ "$rollback_failed" -eq 0 ]; then
            # shellcheck disable=SC2016
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { verifyCoordinatedRollback } from "./scripts/preflight-dev.mjs";
              const deployment = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const versions = JSON.parse(readFileSync(process.argv[2], "utf8"));
              const rollback = verifyCoordinatedRollback(deployment, versions);
              if (rollback.commit !== process.env.ROLLBACK_COMMIT) {
                throw new Error("Il readback non coincide con il commit di rollback.");
              }
              console.log(`Snapshot Development ripristinato: ${rollback.commit}`);
            ' "$RUNNER_TEMP/worker-after-rollback.json" "$RUNNER_TEMP/shopify-after-rollback.json" || rollback_failed=1
          fi

          exit "$rollback_failed"
