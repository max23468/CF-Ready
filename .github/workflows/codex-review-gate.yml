name: Codex review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Numero della PR da verificare
        required: true
        type: number

permissions:
  checks: read
  contents: write
  issues: read
  pull-requests: write
  statuses: write

jobs:
  gate:
    name: Aggiorna gate Codex
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.body == '@codex review' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    concurrency:
      group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verifica il gate
        run: node --test scripts/codex-review-gate.test.mjs
      - name: Attendi la review Codex
        env:
          ADVISORY_REPORT_PATH: ${{ runner.temp }}/codex-advisory.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
        run: node scripts/codex-review-gate.mjs
      - name: Conserva i finding advisory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advisory-codex-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-advisory.json
          if-no-files-found: ignore
          retention-days: 90
