name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WORKER_NAME: cf-ready-prod
  WORKER_URL: https://cf-ready-prod.tmsf.workers.dev

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    outputs:
      worker_rollback_version_id: ${{ steps.rollback_snapshot.outputs.worker_version_id }}
      shopify_rollback_version_tag: ${{ steps.rollback_snapshot.outputs.shopify_version_tag }}
      rollback_armed: ${{ steps.rollback_snapshot.outputs.armed }}
      worker_deploy_started: ${{ steps.arm_worker.outputs.started }}
      shopify_deploy_started: ${{ steps.arm_shopify.outputs.started }}

    steps:
      - name: Verifica branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verifica URL Production persistenti
        run: |
          grep -Fxq 'application_url = "https://cf-ready-prod.tmsf.workers.dev"' shopify.app.toml
          grep -Fxq 'redirect_urls = [ "https://cf-ready-prod.tmsf.workers.dev/auth/callback" ]' shopify.app.toml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm

      - run: npm install --global npm@12.0.2
      - run: npm install --global @shopify/cli@4.7.0
      - run: npm ci

      - name: Verifica credenziali provider
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$SHOPIFY_APP_AUTOMATION_TOKEN"

      - run: npm run check

      # `npm run check` termina con una build Development. Il Vite plugin appiattisce
      # l'ambiente al momento della build, quindi il bundle va rifatto qui e il preflight
      # subito dopo verifica che sia davvero quello Production.
      - name: Ricostruisci per Production
        env:
          CLOUDFLARE_ENV: production
        run: |
          npm run build
          npm run build:function

      - name: Preflight Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: npm run preflight:prod

      - name: Provisiona code webhook Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for queue in cf-ready-webhooks-prod cf-ready-webhooks-prod-failures; do
            if npm exec -- wrangler queues info "$queue" > /dev/null 2>&1; then
              continue
            fi
            npm exec -- wrangler queues create "$queue"
          done

      - name: Prepara versione
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "DEPLOY_VERSION=$version" >> "$GITHUB_ENV"
          # `require()` non carica un modulo ESM con top-level await: serve l'import.
          # shellcheck disable=SC2016
          billing="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { readBillingMode } from "./scripts/preflight-prod.mjs";
            process.stdout.write(readBillingMode(readFileSync("build/server/wrangler.json", "utf8")));
          ')"
          {
            echo "## Ricevuta deploy Production"
            echo "- Ambiente: Production"
            echo "- Configurazione: \`wrangler.json\` env \`production\`, \`shopify.app.toml\`"
            echo "- Worker: \`$WORKER_NAME\`, URL $WORKER_URL"
            echo "- Versione repository/Shopify: \`$version\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Addebiti: **$billing**"
          } >> "$GITHUB_STEP_SUMMARY"

      # Il primo deploy Production non ha un Worker da ripristinare: il caso viene
      # riconosciuto e dichiarato, non aggirato.
      - name: Registra rollback Production
        id: rollback_snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          if npm exec -- wrangler deployments status --config wrangler.json --env production --json \
            > "$RUNNER_TEMP/worker-rollback.json" 2>/dev/null; then :; else echo '{}' > "$RUNNER_TEMP/worker-rollback.json"; fi
          shopify app versions list --no-color --json > "$RUNNER_TEMP/shopify-rollback.json"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { readRollbackTarget } from "./scripts/preflight-prod.mjs";
            const worker = readRollbackTarget(JSON.parse(readFileSync(process.argv[1], "utf8")));
            const versions = JSON.parse(readFileSync(process.argv[2], "utf8"));
            const active = versions.find(({ status }) => status === "active");
            if (!active?.versionTag) {
              throw new Error("Nessuna versione Shopify attiva da registrare per il rollback.");
            }
            const lines = [
              `armed=${worker ? "true" : "false"}`,
              `worker_version_id=${worker?.workerVersionId ?? ""}`,
              `shopify_version_tag=${active?.versionTag ?? ""}`,
            ];
            appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, worker
              ? `- Rollback: Worker deployment \`${worker.deploymentId}\`, versione \`${worker.workerVersionId}\`; Shopify \`${active?.versionTag}\`\n`
              : `- Rollback Worker: **non disponibile**, è il primo deploy Production. Shopify ripristinabile a \`${active?.versionTag}\`\n`);
          ' "$RUNNER_TEMP/worker-rollback.json" "$RUNNER_TEMP/shopify-rollback.json"

      - name: Applica migrazioni D1 Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler d1 migrations apply DB --config wrangler.json --env production --remote

      - name: Readback migrazioni D1 Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm exec -- wrangler d1 migrations list DB --config wrangler.json --env production --remote \
            | tee "$RUNNER_TEMP/d1-migrations.txt"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { verifyNoPendingMigrations } from "./scripts/preflight-prod.mjs";
            verifyNoPendingMigrations(readFileSync(process.argv[1], "utf8"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "- D1 Production: nessuna migrazione pendente dopo il readback remoto\n");
          ' "$RUNNER_TEMP/d1-migrations.txt"

      # Nessun `--env` qui: il bundle appena costruito è già quello Production e wrangler
      # lo legge da .wrangler/deploy/config.json. Passare `--env` cercherebbe un ambiente
      # dentro un file che non ne ha.
      - name: Arma rollback Worker Production
        id: arm_worker
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler deploy --message "Production ${GITHUB_SHA}"

      - name: Readback Worker Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm exec -- wrangler deployments status --config wrangler.json --env production --json \
            > "$RUNNER_TEMP/worker-deployment.json"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const deployment = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!deployment.id ||
                deployment.annotations?.["workers/message"] !== `Production ${process.env.GITHUB_SHA}` ||
                deployment.versions?.length !== 1 || deployment.versions[0].percentage !== 100) {
              throw new Error("Readback Worker Production non riuscito.");
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `- Worker pubblicato: deployment \`${deployment.id}\`, versione \`${deployment.versions[0].version_id}\`\n`);
          ' "$RUNNER_TEMP/worker-deployment.json"

      - name: Smoke Worker Production
        run: |
          curl --fail --silent --show-error --max-time 15 --output /dev/null "$WORKER_URL"
          echo "- Smoke: Worker Production raggiungibile" >> "$GITHUB_STEP_SUMMARY"

      - name: Arma rollback Shopify Production
        id: arm_shopify
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Shopify Production
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: >-
          shopify app deploy
          --allow-updates
          --version "$DEPLOY_VERSION"
          --message "Production ${GITHUB_SHA}"
          --source-control-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          --no-color

      - name: Readback versione attiva Shopify
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          shopify app versions list --no-color --json > "$RUNNER_TEMP/shopify-versions.json"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const versions = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const active = versions.find(({ status }) => status === "active");
            if (active?.versionTag !== process.env.DEPLOY_VERSION ||
                active.message !== `Production ${process.env.GITHUB_SHA}`) {
              throw new Error("Readback Shopify Production non riuscito.");
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `- Shopify attivo: versione \`${active.versionTag}\` (\`${active.versionId}\`)\n`);
          ' "$RUNNER_TEMP/shopify-versions.json"

  rollback:
    name: Ripristina Production se il deploy non termina
    needs: deploy
    if: >-
      ${{ always() && needs.deploy.result != 'success' &&
          needs.deploy.outputs.shopify_rollback_version_tag != '' &&
          (needs.deploy.outputs.worker_deploy_started == 'true' ||
           needs.deploy.outputs.shopify_deploy_started == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm

      - run: npm install --global npm@12.0.2
      - run: npm install --global @shopify/cli@4.7.0
      - run: npm ci

      - name: Ripristina lo snapshot Production precedente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          ROLLBACK_ARMED: ${{ needs.deploy.outputs.rollback_armed }}
          WORKER_ROLLBACK_VERSION_ID: ${{ needs.deploy.outputs.worker_rollback_version_id }}
          SHOPIFY_ROLLBACK_VERSION_TAG: ${{ needs.deploy.outputs.shopify_rollback_version_tag }}
          WORKER_DEPLOY_STARTED: ${{ needs.deploy.outputs.worker_deploy_started }}
          SHOPIFY_DEPLOY_STARTED: ${{ needs.deploy.outputs.shopify_deploy_started }}
        run: |
          rollback_failed=0

          if [ "$SHOPIFY_DEPLOY_STARTED" != "true" ]; then
            echo "- Shopify: invariato, nessun ripristino necessario" >> "$GITHUB_STEP_SUMMARY"
          elif shopify app release --version "$SHOPIFY_ROLLBACK_VERSION_TAG" --allow-updates --no-color; then
            echo "- Shopify ripristinato a \`$SHOPIFY_ROLLBACK_VERSION_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Impossibile ripristinare la versione Shopify Production precedente."
            rollback_failed=1
          fi

          if [ "$WORKER_DEPLOY_STARTED" != "true" ]; then
            echo "- Worker: invariato, nessun ripristino necessario" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ROLLBACK_ARMED" = "true" ]; then
            if npm exec -- wrangler rollback "$WORKER_ROLLBACK_VERSION_ID" \
              --config wrangler.json --env production \
              --message "Rollback Production ${GITHUB_SHA}" --yes; then
              echo "- Worker ripristinato alla versione \`$WORKER_ROLLBACK_VERSION_ID\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Impossibile ripristinare la versione Worker Production precedente."
              rollback_failed=1
            fi
          else
            echo "- Worker: nessun ripristino possibile, era il primo deploy Production" >> "$GITHUB_STEP_SUMMARY"
          fi

          shopify app versions list --no-color --json > "$RUNNER_TEMP/shopify-rollback-readback.json"
          if [ "$WORKER_DEPLOY_STARTED" = "true" ] && [ "$ROLLBACK_ARMED" = "true" ]; then
            npm exec -- wrangler deployments status --config wrangler.json --env production --json \
              > "$RUNNER_TEMP/worker-rollback-readback.json"
          else
            echo '{}' > "$RUNNER_TEMP/worker-rollback-readback.json"
          fi
          # shellcheck disable=SC2016
          if node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const versions = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const deployment = JSON.parse(readFileSync(process.argv[2], "utf8"));
            const active = versions.find(({ status }) => status === "active");
            if ((process.env.SHOPIFY_DEPLOY_STARTED === "true" &&
                 active?.versionTag !== process.env.SHOPIFY_ROLLBACK_VERSION_TAG) ||
                (process.env.WORKER_DEPLOY_STARTED === "true" &&
                 process.env.ROLLBACK_ARMED === "true" &&
                 deployment.versions?.[0]?.version_id !== process.env.WORKER_ROLLBACK_VERSION_ID)) {
              throw new Error("Readback rollback Production non riuscito.");
            }
          ' "$RUNNER_TEMP/shopify-rollback-readback.json" "$RUNNER_TEMP/worker-rollback-readback.json"; then
            echo "- Readback rollback Production: i provider modificati corrispondono allo snapshot" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Il readback non conferma lo snapshot Production precedente."
            rollback_failed=1
          fi

          exit "$rollback_failed"
