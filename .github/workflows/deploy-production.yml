name: Deploy Production

on:
  workflow_dispatch:

permissions:
  attestations: write
  checks: read
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WORKER_NAME: cf-ready-prod
  D1_DATABASE_ID: 6434597c-d683-48d9-a51f-b0d15de6a684
  CF_SEND_TELEMETRY: "false"
  WORKER_URL: https://app.cfready.it

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    outputs:
      worker_rollback_version_id: ${{ steps.rollback_snapshot.outputs.worker_version_id }}
      shopify_rollback_version_tag: ${{ steps.rollback_snapshot.outputs.shopify_version_tag }}
      rollback_armed: ${{ steps.rollback_snapshot.outputs.armed }}
      worker_deploy_started: ${{ steps.arm_worker.outputs.started }}
      shopify_deploy_started: ${{ steps.arm_shopify.outputs.started }}

    steps:
      - name: Verifica branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verifica URL Production persistenti
        run: |
          grep -Fxq 'application_url = "https://app.cfready.it/app"' shopify.app.toml
          grep -Fxq 'redirect_urls = [ "https://app.cfready.it/auth/callback" ]' shopify.app.toml

      - uses: ./.github/actions/setup-node-npm
      - run: npm install --global --allow-scripts=esbuild @shopify/cli@4.9.4
      - run: npm ci

      - name: Verifica credenziali provider
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$SHOPIFY_APP_AUTOMATION_TOKEN"

      - name: Verifica schema Function API
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_FUNCTION_SCHEMA_CONFIG: production
        run: npm run verify:function-schema

      - name: Riusa i gate dell'HEAD Production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECKS: verify,e2e,react-doctor,coverage
        run: node scripts/github-gates.mjs

      # La Vite plugin fissa la mode al momento della build: la Build Output Production
      # nasce qui e viene poi distribuita con `--prebuilt`, senza ricostruzioni.
      - name: Costruisci per Production
        run: |
          npm run build:prod
          npm run build:function

      - name: Preflight Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: npm run preflight:prod

      - name: Provisiona code webhook Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm exec -- cf queues list > "$RUNNER_TEMP/queues.json"
          # La jurisdiction si fissa solo alla creazione; il preflight rifiuta code fuori da `eu`.
          for queue in cf-ready-webhooks-prod cf-ready-webhooks-prod-failures; do
            if jq -e --arg queue "$queue" 'any(.[]; .queue_name == $queue)' "$RUNNER_TEMP/queues.json" > /dev/null; then
              continue
            fi
            npm exec -- cf queues create --queue-name "$queue" --jurisdiction eu > /dev/null
          done

      - name: Prepara versione
        run: |
          version="$(node -p "require('./package.json').version")"
          tree="$(git rev-parse 'HEAD^{tree}')"
          {
            echo "DEPLOY_VERSION=$version"
            echo "REPOSITORY_VERSION=$version"
            echo "GIT_TREE=$tree"
          } >> "$GITHUB_ENV"
          # `require()` non carica un modulo ESM con top-level await: serve l'import.
          # shellcheck disable=SC2016
          billing="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { buildOutput, readBillingMode } from "./scripts/preflight-prod.mjs";
            process.stdout.write(readBillingMode(readFileSync(buildOutput.worker, "utf8")));
          ')"
          {
            echo "## Ricevuta deploy Production"
            echo "- Ambiente: Production"
            echo "- Configurazione: \`cloudflare.config.ts\` mode \`prod\`, \`shopify.app.toml\`"
            echo "- Worker: \`$WORKER_NAME\`, URL $WORKER_URL"
            echo "- Versione repository/Shopify: \`$version\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Tree Git: \`$tree\`"
            echo "- Addebiti: **$billing**"
          } >> "$GITHUB_STEP_SUMMARY"

      # Il primo deploy Production non ha un Worker da ripristinare: il caso viene
      # riconosciuto e dichiarato, non aggirato.
      - name: Registra rollback Production
        id: rollback_snapshot
        run: |
          {
            if [ -n "$ROLLBACK_WORKER_VERSION_ID" ]; then echo "armed=true"; else echo "armed=false"; fi
            echo "worker_version_id=$ROLLBACK_WORKER_VERSION_ID"
            echo "shopify_version_tag=$ROLLBACK_SHOPIFY_VERSION_TAG"
          } >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          printf -- '- Rollback coordinato: Worker `%s`, Shopify `%s`\n' "$ROLLBACK_WORKER_VERSION_ID" "$ROLLBACK_SHOPIFY_VERSION_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Applica migrazioni D1 Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- cf d1 migrations apply "$D1_DATABASE_ID"

      - name: Readback migrazioni D1 Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm exec -- cf d1 migrations list "$D1_DATABASE_ID" > "$RUNNER_TEMP/d1-migrations.json"
          cat "$RUNNER_TEMP/d1-migrations.json"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { verifyNoPendingMigrations } from "./scripts/preflight-common.mjs";
            verifyNoPendingMigrations(readFileSync(process.argv[1], "utf8"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "- D1 Production: nessuna migrazione pendente dopo il readback remoto\n");
          ' "$RUNNER_TEMP/d1-migrations.json"

      - name: Arma rollback Shopify Production
        id: arm_shopify
        if: env.SHOPIFY_DEPLOY_ACTION != 'skip'
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Shopify Production
        if: env.SHOPIFY_DEPLOY_ACTION == 'deploy'
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: >-
          shopify app deploy
          --allow-updates
          --version "$DEPLOY_VERSION"
          --message "Production ${GITHUB_SHA}"
          --source-control-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          --no-color

      - name: Riprendi la versione Shopify Production esistente
        if: env.SHOPIFY_DEPLOY_ACTION == 'release'
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: shopify app release --version "$DEPLOY_VERSION" --allow-updates --no-color

      - name: Readback versione attiva Shopify
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          DEPLOY_ENVIRONMENT: Production
          DEPLOY_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          shopify app versions list --no-color --json > "$RUNNER_TEMP/shopify-versions.json"
          node scripts/provider-readback.mjs shopify "$RUNNER_TEMP/shopify-versions.json"

      # `--prebuilt` distribuisce la Build Output verificata dal preflight; `--mode prod` deve
      # coincidere con quella registrata, altrimenti `cf` si ferma prima dell'upload.
      - name: Arma rollback Worker Production
        id: arm_worker
        if: env.WORKER_DEPLOY_ACTION != 'skip'
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker Production
        if: env.WORKER_DEPLOY_ACTION == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- cf deploy --prebuilt --mode prod --no-provision --message "Production ${GITHUB_SHA}"

      - name: Readback Worker Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: Production
          DEPLOY_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          npm exec -- cf workers deployments list --worker "$WORKER_NAME" > "$RUNNER_TEMP/worker-deployments.json"
          jq '.deployments[0] // {}' "$RUNNER_TEMP/worker-deployments.json" > "$RUNNER_TEMP/worker-deployment.json"
          node scripts/provider-readback.mjs worker "$RUNNER_TEMP/worker-deployment.json"

      - name: Smoke Worker Production
        run: |
          curl --fail --silent --show-error --max-time 15 --output /dev/null "$WORKER_URL"
          echo "- Smoke: Worker Production raggiungibile" >> "$GITHUB_STEP_SUMMARY"

      - name: Genera ricevuta immutabile
        env:
          DEPLOY_ENVIRONMENT: Production
          DEPLOY_RECEIPT_PATH: ${{ runner.temp }}/deploy-receipt-production.json
          ROLLBACK_SHOPIFY_VERSION_TAG: ${{ steps.rollback_snapshot.outputs.shopify_version_tag }}
          ROLLBACK_WORKER_VERSION_ID: ${{ steps.rollback_snapshot.outputs.worker_version_id }}
          SHOPIFY_RECEIPT_PATH: ${{ runner.temp }}/shopify-versions.json
          WORKER_RECEIPT_PATH: ${{ runner.temp }}/worker-deployment.json
        run: node scripts/deploy-receipt.mjs

      - name: Attesta la ricevuta Production
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/deploy-receipt-production.json

      - name: Conserva la ricevuta Production
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-receipt-production-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-receipt-production.json
          retention-days: 90

  rollback:
    name: Ripristina Production se il deploy non termina
    needs: deploy
    if: >-
      ${{ always() && needs.deploy.result != 'success' &&
          needs.deploy.outputs.shopify_rollback_version_tag != '' &&
          (needs.deploy.outputs.worker_deploy_started == 'true' ||
           needs.deploy.outputs.shopify_deploy_started == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-npm
      - run: npm install --global --allow-scripts=esbuild @shopify/cli@4.9.4
      - run: npm ci

      - name: Ripristina lo snapshot Production precedente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          ROLLBACK_ARMED: ${{ needs.deploy.outputs.rollback_armed }}
          WORKER_ROLLBACK_VERSION_ID: ${{ needs.deploy.outputs.worker_rollback_version_id }}
          SHOPIFY_ROLLBACK_VERSION_TAG: ${{ needs.deploy.outputs.shopify_rollback_version_tag }}
          WORKER_DEPLOY_STARTED: ${{ needs.deploy.outputs.worker_deploy_started }}
          SHOPIFY_DEPLOY_STARTED: ${{ needs.deploy.outputs.shopify_deploy_started }}
        run: |
          rollback_failed=0
          worker_ready_for_shopify=0

          if [ "$WORKER_DEPLOY_STARTED" != "true" ]; then
            echo "- Worker: invariato, nessun ripristino necessario" >> "$GITHUB_STEP_SUMMARY"
            worker_ready_for_shopify=1
          elif [ "$ROLLBACK_ARMED" = "true" ]; then
            if npm exec -- cf workers deployments create --worker "$WORKER_NAME" --bypass-deployment-checks \
              --body "$(jq -n --arg version "$WORKER_ROLLBACK_VERSION_ID" --arg message "Rollback Production ${GITHUB_SHA}" \
                '{strategy: "percentage", versions: [{version_id: $version, percentage: 100}], annotations: {"workers/message": $message}}')" \
              > /dev/null; then
              echo "- Worker ripristinato alla versione \`$WORKER_ROLLBACK_VERSION_ID\`" >> "$GITHUB_STEP_SUMMARY"
              worker_ready_for_shopify=1
            else
              echo "::error::Impossibile ripristinare la versione Worker Production precedente."
              rollback_failed=1
            fi
          else
            echo "::error::Worker non ripristinabile: era il primo deploy Production."
            rollback_failed=1
          fi

          if [ "$SHOPIFY_DEPLOY_STARTED" != "true" ]; then
            echo "- Shopify: invariato, nessun ripristino necessario" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$worker_ready_for_shopify" -ne 1 ]; then
            echo "::error::Shopify resta sulla versione compatibile perché il Worker non è stato ripristinato."
            rollback_failed=1
          elif shopify app release --version "$SHOPIFY_ROLLBACK_VERSION_TAG" --allow-updates --no-color; then
            echo "- Shopify ripristinato a \`$SHOPIFY_ROLLBACK_VERSION_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Impossibile ripristinare la versione Shopify Production precedente."
            rollback_failed=1
          fi

          shopify app versions list --no-color --json > "$RUNNER_TEMP/shopify-rollback-readback.json"
          if [ "$WORKER_DEPLOY_STARTED" = "true" ] && [ "$ROLLBACK_ARMED" = "true" ]; then
            npm exec -- cf workers deployments list --worker "$WORKER_NAME" > "$RUNNER_TEMP/worker-rollback-list.json"
            jq '.deployments[0] // {}' "$RUNNER_TEMP/worker-rollback-list.json" > "$RUNNER_TEMP/worker-rollback-readback.json"
          else
            echo '{}' > "$RUNNER_TEMP/worker-rollback-readback.json"
          fi
          # shellcheck disable=SC2016
          if node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const versions = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const deployment = JSON.parse(readFileSync(process.argv[2], "utf8"));
            const active = versions.find(({ status }) => status === "active");
            if ((process.env.SHOPIFY_DEPLOY_STARTED === "true" &&
                 active?.versionTag !== process.env.SHOPIFY_ROLLBACK_VERSION_TAG) ||
                (process.env.WORKER_DEPLOY_STARTED === "true" &&
                 process.env.ROLLBACK_ARMED === "true" &&
                 deployment.versions?.[0]?.version_id !== process.env.WORKER_ROLLBACK_VERSION_ID)) {
              throw new Error("Readback rollback Production non riuscito.");
            }
          ' "$RUNNER_TEMP/shopify-rollback-readback.json" "$RUNNER_TEMP/worker-rollback-readback.json"; then
            echo "- Readback rollback Production: i provider modificati corrispondono allo snapshot" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Il readback non conferma lo snapshot Production precedente."
            rollback_failed=1
          fi

          exit "$rollback_failed"
