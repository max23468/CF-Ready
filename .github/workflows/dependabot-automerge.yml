name: Dependabot auto-merge

# `pull_request_target` è necessario: sugli eventi `pull_request` di Dependabot
# il GITHUB_TOKEN è read-only. Il job non fa checkout né esegue codice della PR.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    name: Abilita auto-merge sicuro
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Instrada la PR su develop
        if: github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --base develop

      - name: Leggi i metadati Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Abilita auto-merge per patch e minor
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
