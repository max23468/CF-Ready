name: Dependabot auto-merge

# Il repository privato su GitHub Free non dispone dell'auto-merge nativo.
# Questo workflow non esegue né fa checkout del codice della PR.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main
      - develop

permissions:
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instrada la PR su develop
        if: github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --base develop

      - name: Leggi i metadati Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attendi i gate e unisci patch e minor
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for _ in {1..72}; do
            checks="$(gh pr view "$PR_URL" --json statusCheckRollup \
              --jq '.statusCheckRollup[] | select(.name != null) | [.name, .status, (.conclusion // "")] | @tsv')"
            ready=true

            for expected in verify react-doctor; do
              result="$(awk -F '\t' -v name="$expected" '$1 == name { print $2 "\t" $3; exit }' <<<"$checks")"
              if [[ -z "$result" ]]; then
                ready=false
                continue
              fi

              read -r status conclusion <<<"$result"
              if [[ "$status" == COMPLETED && "$conclusion" != SUCCESS ]]; then
                echo "::error::$expected concluso con esito $conclusion"
                exit 1
              fi
              [[ "$status" == COMPLETED ]] || ready=false
            done

            if [[ "$ready" == true ]]; then
              current_sha="$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)"
              [[ "$current_sha" == "$HEAD_SHA" ]] || exit 1
              gh pr merge --squash --delete-branch "$PR_URL"
              exit 0
            fi

            sleep 15
          done

          echo "::error::Timeout in attesa dei gate Dependabot"
          exit 1
