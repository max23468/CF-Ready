name: Promotion guard

# `edited` è l'unico evento che scatta quando cambia il base branch di una PR,
# quindi la guardia su `main` deve ascoltarlo. Vive qui e non in CI perché su
# `edited` scatta anche per un titolo o una descrizione: tenerla separata evita
# di rifare l'intera verifica a ogni ritocco del testo della PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: promotion-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.base_ref == 'main' && (github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::main accetta solo promozioni da develop"
          exit 1
      - if: github.base_ref == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-gates.mjs
