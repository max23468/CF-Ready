name: Refactor workspace export

on:
  push:
    branches: [agent/refactor-structural-decomposition]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refactor-workspace
          path: |
            app
            tests
            extensions
            scripts
            package.json
            package-lock.json
            tsconfig.json
            vitest.config.ts
            vite.config.ts
            react-router.config.ts
            worker-configuration.d.ts
          if-no-files-found: error
          retention-days: 1
