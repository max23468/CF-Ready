name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      surface: ${{ steps.lane.outputs.surface }}
      coverage_mode: ${{ steps.lane.outputs.coverage_mode }}
      dependency_review: ${{ steps.lane.outputs.dependency_review }}
      e2e: ${{ steps.lane.outputs.e2e }}
      react_doctor: ${{ steps.lane.outputs.react_doctor }}
      mutation_matrix: ${{ steps.lane.outputs.mutation_matrix }}
      reuse_ci: ${{ steps.reuse.outputs.reuse_ci }}
      reviewed_run: ${{ steps.reuse.outputs.reviewed_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: >-
          node scripts/ci-lane.mjs
          --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
          --base-ref "$BASE_REF" --head-ref "$HEAD_REF"
          --event-name "${{ github.event_name }}" --ref-name "${{ github.ref_name }}"
      - id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MUTATION_MATRIX: ${{ steps.lane.outputs.mutation_matrix }}
        run: node scripts/github-gates.mjs --reuse-ci

  dependency-review:
    needs: lane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.lane.outputs.dependency_review == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - if: needs.lane.outputs.dependency_review != 'true'
        run: echo "Dependency review non applicabile."

  verify:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.lane.outputs.reuse_ci == 'true'
        run: echo "Verifica riusata dalla CI PR ${{ needs.lane.outputs.reviewed_run }} con tree identico."
      - if: needs.lane.outputs.lane == 'promotion'
        name: Riusa i gate verificati di develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-gates.mjs
      - if: needs.lane.outputs.lane != 'promotion' && needs.lane.outputs.reuse_ci != 'true'
        uses: ./.github/actions/setup-node-npm
      - if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        name: Politica di versione del lotto
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/version-policy.mjs --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --head-ref "$HEAD_REF"
      - if: needs.lane.outputs.lane != 'promotion' && needs.lane.outputs.reuse_ci != 'true'
        run: npm ci
      - if: needs.lane.outputs.lane != 'promotion' && needs.lane.outputs.lane != 'docs' && needs.lane.outputs.reuse_ci != 'true'
        name: Installa actionlint verificato
        shell: bash
        run: |
          directory="$RUNNER_TEMP/actionlint"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --output "$directory/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $directory/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$directory/actionlint.tar.gz" -C "$directory" actionlint
          echo "$directory" >> "$GITHUB_PATH"
      - if: needs.lane.outputs.lane != 'promotion' && needs.lane.outputs.lane != 'docs' && needs.lane.outputs.reuse_ci != 'true'
        name: Knip e actionlint bloccanti
        run: npm run quality:knip && npm run quality:workflows
      - if: needs.lane.outputs.lane == 'docs' && needs.lane.outputs.reuse_ci != 'true'
        run: npm run check:docs
      - if: needs.lane.outputs.lane != 'docs' && needs.lane.outputs.surface == 'metadata' && needs.lane.outputs.reuse_ci != 'true'
        run: npm run check:ci-metadata
      - if: needs.lane.outputs.surface == 'operations' && needs.lane.outputs.reuse_ci != 'true'
        run: npm run check:ci-operations
      - if: needs.lane.outputs.lane == 'standard' && needs.lane.outputs.surface == 'runtime' && needs.lane.outputs.reuse_ci != 'true'
        run: npm run check:ci-standard
      - if: needs.lane.outputs.lane == 'full' && needs.lane.outputs.surface == 'runtime' && needs.lane.outputs.reuse_ci != 'true'
        run: npm run check:ci-full

  coverage-collect:
    needs: lane
    if: needs.lane.outputs.coverage_mode != 'none' && needs.lane.outputs.reuse_ci != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.lane.outputs.coverage_mode == 'operations' && '["operations"]' || '["app","ui-chromium","ui-webkit","function","operations"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: startsWith(matrix.part, 'ui-')
        name: Avvia in parallelo le dipendenze di sistema del browser
        env:
          BROWSER: ${{ matrix.part == 'ui-webkit' && 'webkit' || 'chromium' }}
        run: |
          version="$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')"
          (
            status=0
            npx --yes --ignore-scripts "playwright@$version" install-deps "$BROWSER" || status=$?
            echo "$status" > "$RUNNER_TEMP/playwright-deps.exit"
          ) > "$RUNNER_TEMP/playwright-deps.log" 2>&1 < /dev/null &
      - uses: ./.github/actions/setup-node-npm
      - run: npm ci
      - if: startsWith(matrix.part, 'ui-')
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - if: startsWith(matrix.part, 'ui-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: startsWith(matrix.part, 'ui-')
        env:
          BROWSER: ${{ matrix.part == 'ui-webkit' && 'webkit' || 'chromium' }}
        run: |
          npx playwright install "$BROWSER"
          while [ ! -f "$RUNNER_TEMP/playwright-deps.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/playwright-deps.log"
          exit "$(cat "$RUNNER_TEMP/playwright-deps.exit")"
      - run: npm run coverage:${{ matrix.part }}
      - run: node scripts/coverage-collect.mjs --stamp ${{ matrix.part }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-${{ matrix.part }}-${{ github.run_id }}
          path: .coverage/${{ matrix.part }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    needs: [lane, coverage-collect]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          LANE_RESULT: ${{ needs.lane.result }}
          COLLECTION_RESULT: ${{ needs.coverage-collect.result }}
          COVERAGE_MODE: ${{ needs.lane.outputs.coverage_mode }}
          REUSE_CI: ${{ needs.lane.outputs.reuse_ci }}
        run: |
          test "$LANE_RESULT" = success
          if [ "$COVERAGE_MODE" = none ] || [ "$REUSE_CI" = true ]; then
            test "$COLLECTION_RESULT" = skipped
          else
            test "$COLLECTION_RESULT" = success
          fi
      - if: needs.lane.outputs.coverage_mode != 'none' && needs.lane.outputs.reuse_ci != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.lane.outputs.coverage_mode != 'none' && needs.lane.outputs.reuse_ci != 'true'
        uses: ./.github/actions/setup-node-npm
      - if: needs.lane.outputs.coverage_mode != 'none' && needs.lane.outputs.reuse_ci != 'true'
        run: npm ci
      - if: needs.lane.outputs.coverage_mode != 'none' && needs.lane.outputs.reuse_ci != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-part-*-${{ github.run_id }}
          path: .coverage/parts
      - if: needs.lane.outputs.coverage_mode != 'none' && needs.lane.outputs.reuse_ci != 'true'
        env:
          COVERAGE_MODE: ${{ needs.lane.outputs.coverage_mode }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for part in app ui-chromium ui-webkit function operations; do
            source=".coverage/parts/coverage-part-$part-$GITHUB_RUN_ID"
            if [ -d "$source" ]; then mv "$source" ".coverage/$part"; fi
          done
          args=()
          if [ "$COVERAGE_MODE" = operations ]; then args+=(--operations-only); fi
          node scripts/coverage-collect.mjs --verify "${args[@]}"
          node scripts/coverage-report.mjs "${args[@]}" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
      - if: needs.lane.outputs.coverage_mode != 'none' && needs.lane.outputs.reuse_ci != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: |
            .coverage/coverage-summary.json
            .coverage/global
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  critical-mutation:
    needs: lane
    if: needs.lane.outputs.mutation_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.lane.outputs.mutation_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.lane.outputs.reuse_ci != 'true'
        uses: ./.github/actions/setup-node-npm
      - if: needs.lane.outputs.reuse_ci != 'true'
        run: npm ci
      - if: needs.lane.outputs.reuse_ci != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .stryker-incremental/${{ matrix.domain }}.json
          key: mutation-incremental-${{ matrix.domain }}-${{ github.sha }}
          restore-keys: mutation-incremental-${{ matrix.domain }}-
      - if: needs.lane.outputs.reuse_ci != 'true'
        name: Mutation ${{ matrix.domain }}
        env:
          CRITICAL_MUTATION_DOMAIN: ${{ matrix.domain }}
          CRITICAL_MUTATION_INCREMENTAL: "true"
        run: npm run mutation:critical
      - if: needs.lane.outputs.reuse_ci == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mutation-incremental-${{ matrix.domain }}
          run-id: ${{ needs.lane.outputs.reviewed_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .stryker-incremental
      - if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .stryker-incremental/${{ matrix.domain }}.json
          key: mutation-incremental-${{ matrix.domain }}-${{ github.sha }}-${{ github.run_id }}
      - if: needs.lane.outputs.reuse_ci != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-incremental-${{ matrix.domain }}
          path: .stryker-incremental/${{ matrix.domain }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - if: always() && needs.lane.outputs.reuse_ci != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: critical-mutation-${{ matrix.domain }}-${{ github.sha }}
          path: .coverage/mutation/${{ matrix.domain }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  mutation:
    needs: [lane, critical-mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LANE_RESULT: ${{ needs.lane.result }}
          MUTATION_MATRIX: ${{ needs.lane.outputs.mutation_matrix }}
          MUTATION_RESULT: ${{ needs.critical-mutation.result }}
        run: |
          test "$LANE_RESULT" = success
          if [ "$MUTATION_MATRIX" = "[]" ]; then
            test "$MUTATION_RESULT" = skipped
          else
            test "$MUTATION_RESULT" = success
          fi

  e2e:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: needs.lane.outputs.e2e != 'true' || needs.lane.outputs.reuse_ci == 'true'
        run: echo "E2E non applicabili oppure riusati dalla PR verificata."
      - if: needs.lane.outputs.e2e == 'true' && needs.lane.outputs.reuse_ci != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.lane.outputs.e2e == 'true' && needs.lane.outputs.reuse_ci != 'true'
        uses: ./.github/actions/setup-node-npm
      - if: needs.lane.outputs.e2e == 'true' && needs.lane.outputs.reuse_ci != 'true'
        run: npm ci
      - if: needs.lane.outputs.e2e == 'true' && needs.lane.outputs.reuse_ci != 'true'
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - if: needs.lane.outputs.e2e == 'true' && needs.lane.outputs.reuse_ci != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: needs.lane.outputs.e2e == 'true' && needs.lane.outputs.reuse_ci != 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: needs.lane.outputs.e2e == 'true' && needs.lane.outputs.reuse_ci != 'true'
        run: npm run test:e2e
      - name: Carica trace Playwright
        if: failure() && needs.lane.outputs.e2e == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore

  reusable:
    needs: [lane, verify, coverage, mutation, e2e]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event.pull_request.head.sha }}" > ci-reusable.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reusable-${{ github.run_id }}
          path: ci-reusable.txt
          retention-days: 7
