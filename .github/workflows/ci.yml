name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      dependency_review: ${{ steps.lane.outputs.dependency_review }}
      e2e: ${{ steps.lane.outputs.e2e }}
      react_doctor: ${{ steps.lane.outputs.react_doctor }}
      mutation_matrix: ${{ steps.lane.outputs.mutation_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: >-
          node scripts/ci-lane.mjs
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --base-ref "$BASE_REF"
          --head-ref "$HEAD_REF"
          --event-name "${{ github.event_name }}"
          --ref-name "${{ github.ref_name }}"

  dependency-review:
    needs: lane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.lane.outputs.dependency_review == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - if: needs.lane.outputs.dependency_review != 'true'
        run: echo "Dependency review non applicabile alla corsia ${{ needs.lane.outputs.lane }}."

  verify:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.lane.outputs.lane == 'promotion'
        name: Riusa i gate verificati di develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-gates.mjs
      - if: needs.lane.outputs.lane != 'promotion'
        uses: ./.github/actions/setup-node-npm
      - if: needs.lane.outputs.lane != 'promotion'
        run: npm ci
      - if: needs.lane.outputs.lane == 'docs'
        run: npm run check:docs
      - if: needs.lane.outputs.lane == 'standard'
        run: npm run check:ci-standard
      - if: needs.lane.outputs.lane == 'full'
        run: npm run check:ci-full

  coverage:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.lane.outputs.lane != 'standard' && needs.lane.outputs.lane != 'full'
        run: echo "Coverage non applicabile alla corsia ${{ needs.lane.outputs.lane }}."
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # coverage è il percorso critico della PR: i pacchetti apt dei browser, non coperti
      # dalla cache Playwright, si installano mentre procedono setup Node e dipendenze npm.
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        name: Avvia in parallelo le dipendenze di sistema dei browser
        run: |
          version="$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')"
          # Nessun descrittore dello step resta aperto, altrimenti il runner attende il processo.
          (
            status=0
            npx --yes --ignore-scripts "playwright@$version" install-deps chromium webkit || status=$?
            echo "$status" > "$RUNNER_TEMP/playwright-deps.exit"
          ) > "$RUNNER_TEMP/playwright-deps.log" 2>&1 < /dev/null &
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        uses: ./.github/actions/setup-node-npm
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        run: npm ci
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        id: playwright-version
        run: |
          version="$(node -p 'require("@playwright/test/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        name: Installa i browser e attende le dipendenze di sistema
        run: |
          npx playwright install chromium webkit
          while [ ! -f "$RUNNER_TEMP/playwright-deps.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/playwright-deps.log"
          exit "$(cat "$RUNNER_TEMP/playwright-deps.exit")"
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run coverage:check -- --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
      - name: Carica report coverage
        if: always() && (needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            .coverage/coverage-summary.json
            .coverage/global
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  critical-mutation:
    needs: lane
    if: needs.lane.outputs.mutation_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.lane.outputs.mutation_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
      - run: npm ci
      # La base viene solo da develop e dalla campagna completa: le PR la leggono e basta.
      - name: Ripristina il report incrementale ${{ matrix.domain }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .stryker-incremental/${{ matrix.domain }}.json
          key: mutation-incremental-${{ matrix.domain }}-${{ github.sha }}
          restore-keys: mutation-incremental-${{ matrix.domain }}-
      - name: Mutation ${{ matrix.domain }}
        env:
          CRITICAL_MUTATION_DOMAIN: ${{ matrix.domain }}
          CRITICAL_MUTATION_INCREMENTAL: "true"
        run: npm run mutation:critical
      - name: Salva il report incrementale ${{ matrix.domain }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .stryker-incremental/${{ matrix.domain }}.json
          key: mutation-incremental-${{ matrix.domain }}-${{ github.sha }}-${{ github.run_id }}
      - name: Carica report mutation ${{ matrix.domain }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-mutation-${{ matrix.domain }}-${{ github.sha }}
          path: .coverage/mutation/${{ matrix.domain }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Check stabile per il ruleset: la matrice cambia nome per dominio e manca nelle corsie
  # senza domini critici, quindi il merge attende questo esito aggregato.
  mutation:
    needs: [lane, critical-mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LANE_RESULT: ${{ needs.lane.result }}
          MUTATION_MATRIX: ${{ needs.lane.outputs.mutation_matrix }}
          MUTATION_RESULT: ${{ needs.critical-mutation.result }}
        run: |
          test "$LANE_RESULT" = success
          if [ "$MUTATION_MATRIX" = "[]" ]; then
            echo "Mutation non applicabile: il diff non tocca domini critici."
            test "$MUTATION_RESULT" = skipped
          else
            test "$MUTATION_RESULT" = success
          fi

  e2e:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: needs.lane.outputs.e2e != 'true'
        run: echo "E2E non applicabili alla corsia ${{ needs.lane.outputs.lane }}."
      - if: needs.lane.outputs.e2e == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.lane.outputs.e2e == 'true'
        uses: ./.github/actions/setup-node-npm
      - if: needs.lane.outputs.e2e == 'true'
        run: npm ci
      - if: needs.lane.outputs.e2e == 'true'
        id: playwright-version
        run: |
          version="$(node -p 'require("@playwright/test/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: needs.lane.outputs.e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: needs.lane.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: needs.lane.outputs.e2e == 'true'
        run: npm run test:e2e
      - name: Carica trace Playwright
        if: failure() && needs.lane.outputs.e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
