name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      dependency_review: ${{ steps.lane.outputs.dependency_review }}
      e2e: ${{ steps.lane.outputs.e2e }}
      react_doctor: ${{ steps.lane.outputs.react_doctor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: >-
          node scripts/ci-lane.mjs
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --base-ref "$BASE_REF"
          --head-ref "$HEAD_REF"

  dependency-review:
    needs: lane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.lane.outputs.dependency_review == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - if: needs.lane.outputs.dependency_review != 'true'
        run: echo "Dependency review non applicabile alla corsia ${{ needs.lane.outputs.lane }}."

  verify:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.lane.outputs.lane == 'promotion'
        name: Riusa i gate verificati di develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-gates.mjs
      - if: needs.lane.outputs.lane != 'promotion'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - if: needs.lane.outputs.lane != 'promotion'
        run: npm install --global npm@12.0.2
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        run: npm install --global --allow-scripts=esbuild @shopify/cli@4.7.1
      - if: needs.lane.outputs.lane != 'promotion'
        run: npm ci
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        run: npx playwright install --with-deps chromium
      - if: needs.lane.outputs.lane == 'docs'
        run: npm run check:docs
      - if: needs.lane.outputs.lane == 'standard'
        run: npm run check:standard
      - if: needs.lane.outputs.lane == 'full'
        run: npm run check

  coverage:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.lane.outputs.lane != 'standard' && needs.lane.outputs.lane != 'full'
        run: echo "Coverage non applicabile alla corsia ${{ needs.lane.outputs.lane }}."
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        run: npm install --global npm@12.0.2
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        run: npm ci
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        run: npx playwright install --with-deps chromium
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run coverage:check -- --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
      - name: Mutation gate webhook
        if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            app/routes/webhooks.app.billing.tsx \
            app/routes/webhooks.app.scopes_update.tsx \
            app/routes/webhooks.app.uninstalled.tsx \
            app/routes/webhooks.compliance.tsx \
            app/routes/webhooks.shop.update.tsx \
            app/webhook-auth.server.ts \
            app/webhook-jobs.server.ts \
            app/webhooks.server.ts \
            tests/webhook-jobs.test.ts \
            tests/webhooks \
            config/coverage-policy.json \
            package.json \
            package-lock.json \
            scripts/run-critical-mutation.mjs \
            stryker.critical.config.mjs; then
            echo "Mutation webhook non applicabile al diff."
          else
            CRITICAL_MUTATION_DOMAIN=webhooks npm run mutation:critical
          fi
      - name: Carica report coverage
        if: always() && (needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            .coverage/coverage-summary.json
            .coverage/global
            .coverage/mutation/webhooks.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  critical-mutation:
    needs: lane
    if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        domain: [billing, validation, ownerNotifications]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            app/billing \
            app/checkout-field-validation.ts \
            app/validation \
            app/owner-notifications.server.ts \
            app/owner-notifications \
            tests/billing \
            tests/validation.test.ts \
            tests/validation \
            tests/owner-notifications.test.ts \
            tests/owner-notification-contracts.test.ts \
            config/coverage-policy.json \
            package.json \
            package-lock.json \
            scripts/run-critical-mutation.mjs \
            stryker.critical.config.mjs; then
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "Mutation domini commerciali non applicabile al diff."
          else
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mutation ${{ matrix.domain }}
        if: steps.applicability.outputs.applicable == 'true'
        env:
          CRITICAL_MUTATION_DOMAIN: ${{ matrix.domain }}
        run: npm run mutation:critical
      - name: Carica report mutation ${{ matrix.domain }}
        if: always() && steps.applicability.outputs.applicable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-mutation-${{ matrix.domain }}-${{ github.sha }}
          path: .coverage/mutation/${{ matrix.domain }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: needs.lane.outputs.e2e != 'true'
        run: echo "E2E non applicabili alla corsia ${{ needs.lane.outputs.lane }}."
      - if: needs.lane.outputs.e2e == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.lane.outputs.e2e == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - if: needs.lane.outputs.e2e == 'true'
        run: npm install --global npm@12.0.2
      - if: needs.lane.outputs.e2e == 'true'
        run: npm ci
      - if: needs.lane.outputs.e2e == 'true'
        id: playwright-version
        run: |
          version="$(node -p 'require("@playwright/test/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: needs.lane.outputs.e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: needs.lane.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: needs.lane.outputs.e2e == 'true'
        run: npm run test:e2e
      - name: Carica trace Playwright
        if: failure() && needs.lane.outputs.e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
