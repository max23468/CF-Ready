name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      dependency_review: ${{ steps.lane.outputs.dependency_review }}
      e2e: ${{ steps.lane.outputs.e2e }}
      react_doctor: ${{ steps.lane.outputs.react_doctor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: >-
          node scripts/ci-lane.mjs
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --base-ref "$BASE_REF"
          --head-ref "$HEAD_REF"

  dependency-review:
    needs: lane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.lane.outputs.dependency_review == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - if: needs.lane.outputs.dependency_review != 'true'
        run: echo "Dependency review non applicabile alla corsia ${{ needs.lane.outputs.lane }}."

  verify:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.lane.outputs.lane == 'promotion'
        name: Riusa i gate verificati di develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-gates.mjs
      - if: needs.lane.outputs.lane != 'promotion'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - if: needs.lane.outputs.lane != 'promotion'
        run: npm install --global npm@12.0.2
      - if: needs.lane.outputs.lane == 'standard' || needs.lane.outputs.lane == 'full'
        run: npm install --global --allow-scripts=esbuild @shopify/cli@4.7.0
      - if: needs.lane.outputs.lane != 'promotion'
        run: npm ci
      - if: needs.lane.outputs.lane == 'docs'
        run: npm run check:docs
      - if: needs.lane.outputs.lane == 'standard'
        run: npm run check:standard
      - if: needs.lane.outputs.lane == 'full'
        run: npm run check

  e2e:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.lane.outputs.e2e != 'true'
        run: echo "E2E non applicabili alla corsia ${{ needs.lane.outputs.lane }}."
      - if: needs.lane.outputs.e2e == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.lane.outputs.e2e == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - if: needs.lane.outputs.e2e == 'true'
        run: npm install --global npm@12.0.2
      - if: needs.lane.outputs.e2e == 'true'
        run: npm ci
      - if: needs.lane.outputs.e2e == 'true'
        id: playwright-version
        run: |
          version="$(node -p 'require("@playwright/test/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: needs.lane.outputs.e2e == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: needs.lane.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: needs.lane.outputs.e2e == 'true'
        run: npm run test:e2e
      - name: Carica trace Playwright
        if: failure() && needs.lane.outputs.e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
