name: Finalize refactor PR

on:
  push:
    branches:
      - agent/refactor-structural-decomposition

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm install --global @shopify/cli@4.6.0
      - run: npm ci
      - name: Versione e changelog
        run: |
          npm version 0.9.21 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text()
          marker = '## 0.9.20 — 10 agosto 2026'
          entry = '''## 0.9.21 — 16 agosto 2026

- Validation e billing sono separati in moduli per dominio, accesso Shopify,
  persistenza e orchestrazione, mantenendo invariati gli export pubblici e il
  comportamento applicativo;
- la Home separa loader e action server-side dai componenti UI, mentre i
  cataloghi i18n e le suite monolitiche sono suddivisi per responsabilità;
- la fixture Validation usa la data locale corrente invece di una data fissa,
  evitando che la prova di 14 giorni renda i test dipendenti dal calendario.

'''
          if marker not in text:
              raise SystemExit('Intestazione changelog inattesa')
          p.write_text(text.replace(marker, entry + marker, 1))
          PY
      - run: npm run check
      - run: git diff --check
      - name: Registra finalizzazione verificata
        run: |
          rm .github/workflows/finalize-refactor-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "chore: prepara versione 0.9.21"
          git push origin HEAD:agent/refactor-structural-decomposition
