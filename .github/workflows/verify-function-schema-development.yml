name: Verify Function schema Development

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-function-schema-development
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Function schema Development
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Development

    steps:
      - name: Verifica branch
        run: test "$GITHUB_REF" = "refs/heads/develop"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm

      - run: npm install --global npm@12.0.2
      - run: npm install --global --allow-scripts=esbuild @shopify/cli@4.7.0
      - run: npm ci

      - name: Verifica credenziale Shopify Development
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: test -n "$SHOPIFY_APP_AUTOMATION_TOKEN"

      - name: Verifica schema Function API
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: npm run verify:function-schema

      - name: Readback Shopify Development
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          shopify app versions list --config dev --no-color --json > "$RUNNER_TEMP/shopify-versions.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const versions = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const expected = JSON.parse(readFileSync("package.json", "utf8")).version;
            const active = versions.find(({ status }) => status === "active");
            if (active?.versionTag !== expected) {
              throw new Error("Readback Shopify Development non allineato alla versione repository.");
            }
          ' "$RUNNER_TEMP/shopify-versions.json"
          {
            echo "## Ricevuta schema Function Development"
            echo "- Ambiente: Development"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Function API: \`2026-07\`, schema semanticamente allineato"
            echo "- Shopify: versione \`$(node -p "require('./package.json').version")\` attiva"
            echo "- Scritture provider: nessuna"
          } >> "$GITHUB_STEP_SUMMARY"
