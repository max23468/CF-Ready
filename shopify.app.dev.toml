# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "adff48d4fe4ceb0dadb4734520701dd7"
name = "CF Ready Development"
handle = "cf-ready-development"
application_url = "https://cf-ready-dev.tmsf.workers.dev/app"
embedded = true

[access_scopes]
scopes = "write_validations"
optional_scopes = [ "write_translations", "read_locales", "read_markets", "read_orders", "write_orders" ]

# D-210: origini che il codice dell'app home carica o chiama dal browser. La chat di
# assistenza apre tawk.to; cdn.shopify.com è servito da Shopify e non si dichiara.
[network_access]
allowed_sources = [ "https://cf-ready-dev.tmsf.workers.dev", "https://tawk.to" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "https://cf-ready-dev.tmsf.workers.dev/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "https://cf-ready-dev.tmsf.workers.dev/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "https://cf-ready-dev.tmsf.workers.dev/webhooks/shop/update"
  topics = [ "shop/update" ]

  [[webhooks.subscriptions]]
  uri = "https://cf-ready-dev.tmsf.workers.dev/webhooks/app/billing"
  topics = [ "app_subscriptions/update", "app_purchases_one_time/update" ]

  [[webhooks.subscriptions]]
  uri = "https://cf-ready-dev.tmsf.workers.dev/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://cf-ready-dev.tmsf.workers.dev/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
